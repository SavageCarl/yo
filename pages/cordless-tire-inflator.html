      '<p class="nsi-eyebrow lt ctr">' + esc(pb.eyebrow) + '</p>' +
      '<h2>' + esc(pb.headline) + '</h2>' +
      '<p class="nsi-lede">' + esc(pb.subheadline) + '</p>' +
      '<div class="nsi-bundle-card">' +
        (pb.badge ? '<span class="nsi-badge">' + esc(pb.badge) + '</span>' : '') +
        '<h3 style="font-size:1.4rem">' + esc(pb.bundleName) + '</h3>' +
        '<div class="nsi-bundle-items">' + pb.items.map(function(it){
          return '<div class="nsi-bundle-item"><span class="nsi-tag">' + esc(it.tag) + '</span><p>' + esc(it.solution) + '</p></div>';
        }).join("") + '</div>' +
        '<div class="nsi-bundle-price">' +
          '<span class="nsi-price">' + esc(pb.bundlePrice) + '</span> ' +
          (pb.bundleComparePrice ? '<span class="nsi-compare">' + esc(pb.bundleComparePrice) + '</span>' : '') +
          (pb.shippingText ? '<span class="nsi-bundle-ship">' + esc(pb.shippingText) + '</span>' : '') +
        '</div>' +
        '<a class="nsi-btn nsi-btn-block" href="' + cartLink(pb.bundleVariantId) + '" data-loc="bundle">' + esc(pb.ctaText) + '</a>' +
      '</div>' +
    '</div>';
}

function renderFinal(){
  var f = content.finalCta;
  var copy =
    '<div class="nsi-final-copy">' +
      '<h2>' + esc(f.headline) + '</h2>' +
      '<p class="nsi-sub">' + esc(f.subheadline) + '</p>' +
      '<div class="nsi-price-row">' +
        '<span class="nsi-price">' + esc(content.productName) + ' — ' + esc(content.productPrice) + '</span>' +
      '</div>' +
      '<a class="nsi-btn" href="' + cartLink(content.productVariantId) + '" data-loc="final">' + esc(f.ctaText) + '</a>' +
    '</div>';
  var media = f.image ? '<div class="nsi-final-media"><img src="' + esc(f.image) + '" alt="' + esc(f.imageAlt) + '" loading="lazy"></div>' : '';
  document.getElementById("nsi-final").innerHTML =
    '<div class="nsi-wrap">' +
      (media ? '<div class="nsi-final-grid">' + copy + media + '</div>' : copy) +
    '</div>';
}

function renderFooter(){
  var f = content.footer;
  document.getElementById("nsi-footer").innerHTML =
    '<strong>' + esc(content.brandName) + '</strong> · ' + esc(content.supportPhone) + ' · ' + esc(content.supportEmail) +
    '<span class="nsi-footer-links">' + f.links.map(function(l){
      return '<a href="' + esc(l.href) + '">' + esc(l.label) + '</a>';
    }).join("") + '</span>';
}

function renderSticky(){
  var bar = document.getElementById("nsi-sticky");
  bar.innerHTML =
    '<span class="nsi-sticky-price">' + esc(content.productPrice) + (content.comparePrice ? '<s>' + esc(content.comparePrice) + '</s>' : '') + '</span>' +
    '<a class="nsi-btn" href="' + cartLink(content.productVariantId) + '" data-loc="sticky">' + esc(content.primaryCTA) + '</a>';
  bar.setAttribute("data-enabled", "true");
  var hero = document.getElementById("nsi-hero");
  if(hero && "IntersectionObserver" in window){
    bar.classList.add("nsi-hero-visible");
    new IntersectionObserver(function(entries){
      bar.classList.toggle("nsi-hero-visible", entries[0].isIntersecting);
    }, { threshold: 0 }).observe(hero);
  }
}

function renderJsonLd(){
  var data = {
    "@context": "https://schema.org/",
    "@type": "Product",
    "name": content.productName,
    "brand": { "@type": "Brand", "name": content.brandName },
    "description": content.hero.subheadline,
    "offers": {
      "@type": "Offer",
      "priceCurrency": "USD",
      "price": content.productPrice.replace(/[^0-9.]/g, ""),
      "availability": "https://schema.org/InStock"
    }
  };
  document.getElementById("nsi-jsonld").textContent = JSON.stringify(data);
}

function render(){
  applyDesignTokens();
  renderHero();
  renderMidCta("nsi-mid-cta-1", "after-problem-lead-in");
  renderProblem();
  renderSolution();
  renderDemo();
  renderBenefits();
  renderCore();
  renderReviews();
  renderOffer();
  renderTripwire();
  renderBundle();
  renderFaq();
  renderFinal();
  renderFooter();
  renderSticky();
  renderJsonLd();
}

if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", render);
} else {
  render();
}

})();
</script>
