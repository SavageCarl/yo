<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLASHFISH 200W</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1115;
      --fg: #f5f5f5;
      --accent: #ffb703;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
    }
    .hero {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      text-align: center;
    }
    .hero h1 {
      font-size: clamp(1.75rem, 5vw, 3rem);
      font-weight: 800;
      letter-spacing: 0.02em;
    }
    .hero h1 .highlight {
      color: var(--accent);
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1rem 4rem;
      text-align: center;
    }
    main p {
      font-size: 1.1rem;
      line-height: 1.6;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <header class="hero">
    <h1>PRODUCT: <span class="highlight">FLASHFISH 200W</span></h1>
  </header>
  <main>
    <p>Welcome to the landing page. Details coming soon.</p>
  </main>
</body>
</html>
